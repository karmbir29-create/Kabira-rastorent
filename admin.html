<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gagan Admin</title><style>body{font-family:Arial;margin:0;background:#f5f5f5}.top{background:#8b0000;color:#fff;padding:20px}.box{max-width:700px;margin:20px auto;background:#fff;padding:20px;border-radius:15px}.card{border:1px solid #ddd;border-radius:12px;padding:14px;margin:10px 0}.btn{background:#8b0000;color:#fff;border:0;padding:10px;border-radius:9px}</style></head><body><div class="top"><h2>Gagan Hotel & Restaurant — Admin</h2><div>Orders Dashboard</div></div><div class="box"><h3>Latest Order</h3><div id="order">No order yet.</div><button class="btn" onclick="refresh()">Refresh</button></div><script>
function refresh(){let o=JSON.parse(localStorage.getItem("lastOrder")||"null");order.innerHTML=o?`<div class="card"><b>${o.id}</b><br>${o.name} • ${o.phone}<br>${o.address}<br>Items: ${o.items.join(", ")}<br>Total: ₹${o.total}<br>Payment: ${o.payment}<br>Status: <b>${o.status}</b><br>${o.time}</div>`:"No order yet."}refresh();
</script></body></html>
